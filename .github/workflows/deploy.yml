name: Deploy to Azure VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write .env for build
        run: |
          cat > .env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL=http://${{ secrets.AZURE_VPS_HOST }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_APP_URL=http://${{ secrets.AZURE_VPS_HOST }}
          NODE_ENV=production
          PORT=3000
          EOF

      - name: Install dependencies (runner)
        run: npm ci --legacy-peer-deps

      - name: Build app (runner)
        run: |
          ./node_modules/.bin/prisma generate
          npm run build

      - name: Setup SSH
  shell: bash
  run: |
    set -euxo pipefail

    install -d -m 700 "$HOME/.ssh"
    printf '%s\n' "${{ secrets.AZURE_VPS_SSH_KEY }}" > "$HOME/.ssh/id_rsa"
    chmod 600 "$HOME/.ssh/id_rsa"

    HOST="${{ secrets.AZURE_VPS_HOST }}"

    echo "Resolving host..."
    getent ahostsv4 "$HOST"

    echo "Fetching SSH host key..."
    for i in 1 2 3; do
      if ssh-keyscan -4 -T 20 -t ed25519,rsa -H "$HOST" >> "$HOME/.ssh/known_hosts"; then
        break
      fi
      echo "ssh-keyscan attempt $i failed, retrying..."
      sleep 3
    done
      - name: Prepare VPS directory
        run: |
          ssh -i "$HOME/.ssh/id_rsa" "${{ secrets.AZURE_VPS_USER }}@${{ secrets.AZURE_VPS_HOST }}" \
            "sudo mkdir -p /var/www/qrforge && sudo chown \$USER:\$USER /var/www/qrforge"

      - name: Sync built app to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            --exclude='.git' \
            --exclude='.github' \
            ./ "${{ secrets.AZURE_VPS_USER }}@${{ secrets.AZURE_VPS_HOST }}:/var/www/qrforge/"

      - name: Start app on VPS
        run: |
          ssh -i "$HOME/.ssh/id_rsa" "${{ secrets.AZURE_VPS_USER }}@${{ secrets.AZURE_VPS_HOST }}" << 'ENDSSH'
            set -euxo pipefail
            cd /var/www/qrforge

            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            if pm2 show qrforge >/dev/null 2>&1; then
              pm2 reload qrforge --update-env
            else
              pm2 start npm --name qrforge -- start
              pm2 save
              sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u $USER --hp $HOME | tail -1 | sudo bash || true
            fi

            echo "✅ App running"
          ENDSSH

      - name: Open port 80 → 3000
        run: |
          ssh -i "$HOME/.ssh/id_rsa" "${{ secrets.AZURE_VPS_USER }}@${{ secrets.AZURE_VPS_HOST }}" << 'ENDSSH'
            set -euxo pipefail

            if ! sudo iptables -t nat -C PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 3000 2>/dev/null; then
              sudo iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 3000
              sudo iptables -t nat -A OUTPUT -p tcp --dport 80 -j REDIRECT --to-port 3000
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iptables-persistent
              sudo netfilter-persistent save
            fi
          ENDSSH