name: Deploy to Azure VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write .env for build
        run: |
          cat > .env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL=http://${{ secrets.AZURE_VPS_HOST }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_APP_URL=http://${{ secrets.AZURE_VPS_HOST }}
          NODE_ENV=production
          PORT=3000
          EOF

      - name: Install dependencies (runner)
        run: npm ci --legacy-peer-deps

      - name: Build app (runner)
        run: |
          ./node_modules/.bin/prisma generate
          npm run build

      - name: Setup SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.AZURE_VPS_SSH_KEY }}" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          HOST="${{ secrets.AZURE_VPS_HOST }}"
          
          echo "Configuring SSH client..."
          cat > "$HOME/.ssh/config" << EOF
          Host $HOST
            StrictHostKeyChecking accept-new
            UserKnownHostsFile=/dev/null
            IdentityFile=$HOME/.ssh/id_rsa
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 60
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 "$HOME/.ssh/config"
          
          echo "SSH config ready"

      - name: Prepare VPS directory
        shell: bash
        run: |
          HOST_ADDR="${{ secrets.AZURE_VPS_USER }}@${{ secrets.AZURE_VPS_HOST }}"
          
          echo "Preparing VPS directory..."
          for i in {1..5}; do
            echo "Attempt $i..."
            if ssh -i "$HOME/.ssh/id_rsa" "$HOST_ADDR" "sudo mkdir -p /var/www/qrforge && sudo chown \$USER:\$USER /var/www/qrforge"; then
              echo "✓ VPS directory prepared"
              exit 0
            fi
            if [ $i -lt 5 ]; then
              echo "Failed, waiting 10s before retry..."
              sleep 10
            fi
          done
          echo "Failed to prepare VPS directory after 5 attempts"
          exit 1

      - name: Sync built app to VPS
        shell: bash
        run: |
          echo "Syncing code to VPS..."
          for i in {1..3}; do
            echo "Sync attempt $i..."
            if rsync -az --delete \
              -e "ssh -i $HOME/.ssh/id_rsa" \
              --exclude='.git' \
              --exclude='.github' \
              ./ "${{ secrets.AZURE_VPS_USER }}@${{ secrets.AZURE_VPS_HOST }}:/var/www/qrforge/"; then
              echo "✓ Code synced successfully"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Sync failed, retrying in 5s..."
              sleep 5
            fi
          done
          echo "Failed to sync code after 3 attempts"
          exit 1

      - name: Start app on VPS
        shell: bash
        run: |
          HOST_ADDR="${{ secrets.AZURE_VPS_USER }}@${{ secrets.AZURE_VPS_HOST }}"
          
          # Step 1: Ensure Node.js is installed
          echo "Step 1: Checking Node.js installation..."
          for i in {1..3}; do
            if ssh -i "$HOME/.ssh/id_rsa" "$HOST_ADDR" << 'STEP1'
          set -e
          if ! command -v node >/dev/null 2>&1; then
            echo "Installing Node.js 20..."
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          echo "✓ Node.js installed: $(node -v)"
          STEP1
            then
              break
            fi
            if [ $i -lt 3 ]; then sleep 5; fi
          done
          
          # Step 2: Install dependencies with timeout
          echo "Step 2: Installing app dependencies (this may take 2-3 minutes)..."
          for i in {1..2}; do
            if timeout 300 ssh -i "$HOME/.ssh/id_rsa" "$HOST_ADDR" << 'STEP2'
          set -e
          cd /var/www/qrforge
          echo "Running: npm ci --legacy-peer-deps"
          npm ci --legacy-peer-deps
          echo "✓ Dependencies installed"
          STEP2
            then
              break
            fi
            if [ $i -lt 2 ]; then
              echo "npm install failed, retrying..."
              sleep 10
            fi
          done
          
          # Step 3: Install PM2
          echo "Step 3: Installing PM2..."
          ssh -i "$HOME/.ssh/id_rsa" "$HOST_ADDR" << 'STEP3'
          set -e
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "Installing PM2 globally..."
            sudo npm install -g pm2 --legacy-peer-deps
          fi
          echo "✓ PM2 installed"
          STEP3
          
          # Step 4: Run migrations
          echo "Step 4: Running database migrations..."
          ssh -i "$HOME/.ssh/id_rsa" "$HOST_ADDR" << 'STEP4'
          set -e
          cd /var/www/qrforge
          echo "Running: npx prisma migrate deploy"
          npx prisma migrate deploy || echo "Note: Migrations may already be up to date"
          echo "✓ Migrations complete"
          STEP4
          
          # Step 5: Start application
          echo "Step 5: Starting application with PM2..."
          ssh -i "$HOME/.ssh/id_rsa" "$HOST_ADDR" << 'STEP5'
          set -e
          cd /var/www/qrforge
          
          if pm2 show qrforge >/dev/null 2>&1; then
            echo "Reloading existing app..."
            pm2 reload qrforge --update-env
          else
            echo "Starting new app instance..."
            pm2 start npm --name qrforge -- start
            pm2 save
            echo "Setting up PM2 to start on boot..."
            sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u $USER --hp $HOME | tail -1 | sudo bash || true
          fi
          
          sleep 2
          pm2 logs qrforge --lines 5
          echo "✅ App running on port 3000"
          STEP5

      - name: Open port 80 → 3000
        shell: bash
        run: |
          echo "Configuring port forwarding..."
          for i in {1..3}; do
            echo "Attempt $i..."
            if ssh -i "$HOME/.ssh/id_rsa" "${{ secrets.AZURE_VPS_USER }}@${{ secrets.AZURE_VPS_HOST }}" << 'ENDSSH'
          set -e
          
          if ! sudo iptables -t nat -C PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 3000 2>/dev/null; then
            echo "Setting up iptables port forwarding..."
            sudo iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 3000
            sudo iptables -t nat -A OUTPUT -p tcp --dport 80 -j REDIRECT --to-port 3000
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iptables-persistent
            sudo netfilter-persistent save
          fi
          
          echo "✓ Port forwarding configured"
          ENDSSH
            then
              echo "✓ Port forwarding configured successfully"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Failed, retrying..."
              sleep 5
            fi
          done
          echo "Warning: Port forwarding configuration failed, but deployment may still work"