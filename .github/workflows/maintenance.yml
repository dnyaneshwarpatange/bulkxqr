name: Maintenance

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        type: choice
        options:
          - db-cleanup
          - dep-audit
          - all

jobs:
  db-cleanup:
    name: Cleanup Stale Records
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.task == 'db-cleanup' || inputs.task == 'all'))

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AZURE_VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Run cleanup on VPS
        run: |
          ssh ${{ secrets.AZURE_VPS_USER }}@${{ secrets.AZURE_VPS_HOST }} << 'ENDSSH'
            set -e
            source /var/www/qrforge/.env

            echo "=== Deleting QR codes older than 90 days for free users ==="
            psql "$DATABASE_URL" -c "DELETE FROM \"QRCode\" WHERE \"createdAt\" < NOW() - INTERVAL '90 days' AND \"userId\" IN (SELECT \"userId\" FROM \"Subscription\" WHERE plan = 'free');"

            echo "=== Expiring old coupons ==="
            psql "$DATABASE_URL" -c "UPDATE \"DiscountCoupon\" SET \"isActive\" = false WHERE \"expiresAt\" IS NOT NULL AND \"expiresAt\" < NOW() AND \"isActive\" = true;"

            echo "✅ Cleanup complete"
          ENDSSH

  dep-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 3 * * 0' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.task == 'dep-audit' || inputs.task == 'all'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check outdated
        run: npm outdated || true