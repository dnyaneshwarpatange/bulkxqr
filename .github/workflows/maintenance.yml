name: Maintenance

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: true
        type: choice
        options:
          - db-cleanup
          - dep-audit
          - all

jobs:
  db-cleanup:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.task == 'db-cleanup' || inputs.task == 'all'))

    steps:
      - name: Setup SSH
        shell: bash
        run: |
          set -euxo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.AZURE_VPS_SSH_KEY }}" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keyscan -H "${{ secrets.AZURE_VPS_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Run cleanup on VPS
        run: |
          ssh -i "$HOME/.ssh/id_rsa" "${{ secrets.AZURE_VPS_USER }}@${{ secrets.AZURE_VPS_HOST }}" << 'ENDSSH'
            set -euxo pipefail
            cd /var/www/BulkXQR

            if ! command -v psql >/dev/null 2>&1; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
            fi

            set -a
            . ./.env
            set +a

            echo "Cleaning old QR codes..."
            psql "$DATABASE_URL" -c "
              DELETE FROM \"QRCode\"
              WHERE \"createdAt\" < NOW() - INTERVAL '90 days'
              AND \"userId\" IN (
                SELECT \"userId\" FROM \"Subscription\" WHERE plan = 'free'
              );
            "

            echo "Expiring coupons..."
            psql "$DATABASE_URL" -c "
              UPDATE \"DiscountCoupon\"
              SET \"isActive\" = false
              WHERE \"expiresAt\" < NOW()
              AND \"isActive\" = true;
            "

            echo "✅ Done"
          ENDSSH

  dep-audit:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.task == 'dep-audit' || inputs.task == 'all'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Audit
        run: npm audit --audit-level=high || true

      - name: Outdated
        run: npm outdated || true